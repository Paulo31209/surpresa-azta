<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #ff4f8b;
    --rosa-esc: #e0306f;
    --rosa-claro: #ffe3ee;
    --vinho: #6b1036;
    --texto: #4a1a2c;
    --card: #ffffffee;
    --verde: #2fbf71;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: var(--texto);
    background: linear-gradient(160deg, #ffd1e1 0%, #ffb3cc 45%, #ff8fb3 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    min-height: 100dvh;
  }
  #bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .float-heart {
    position: absolute; bottom: -40px; opacity: .55;
    animation: subir linear forwards;
  }
  @keyframes subir {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  main {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto; padding-block: 16px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%; display: flex; flex-direction: column; justify-content: center;
  }
  .topo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .barra { flex: 1; height: 12px; background: #ffffff88; border-radius: 99px; overflow: hidden; }
  .barra > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--rosa), #ff9a5a); border-radius: 99px; transition: width .5s ease; }
  .contador { font-weight: 800; color: var(--vinho); font-size: 15px; min-width: 44px; text-align: right; }

  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 26px 20px 22px;
    box-shadow: 0 18px 50px -12px #b0204f66;
    text-align: center;
    position: relative;
    animation: entrar .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes entrar { from { transform: scale(.85) translateY(20px); opacity: 0; } }
  .num { display: inline-block; background: var(--rosa-claro); color: var(--rosa-esc); font-weight: 800; padding: 2px 14px; border-radius: 99px; font-size: 14px; margin-bottom: 8px; }
  h1 { font-size: 34px; line-height: 1.1; margin: 6px 0 10px; color: var(--vinho); }
  h2 { font-size: 25px; line-height: 1.2; margin: 4px 0 18px; color: var(--vinho); }
  p.sub { margin: 0 0 18px; font-size: 18px; opacity: .85; }
  .emoji-grande { font-size: 64px; line-height: 1; margin-bottom: 6px; }

  .opcoes { display: flex; flex-direction: column; gap: 10px; position: relative; }
  .opcoes.lado { flex-direction: row; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-weight: 700; font-size: 20px;
    border: 0; border-radius: 18px; padding: 13px 18px; cursor: pointer;
    background: var(--rosa-claro); color: var(--vinho);
    box-shadow: 0 4px 0 #f3b5cb;
    transition: transform .15s, background .2s, font-size .3s, padding .3s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #f3b5cb; }
  .btn.escolhido { background: var(--rosa); color: #fff; box-shadow: 0 4px 0 var(--rosa-esc); }
  .btn.principal { background: var(--rosa); color: #fff; box-shadow: 0 4px 0 var(--rosa-esc); }
  .btn.sim { background: var(--verde); color: #fff; box-shadow: 0 4px 0 #1e8f52; }
  .opcoes.lado .btn { min-width: 120px; }
  .fugitivo { position: relative; z-index: 5; transition: left .25s ease, top .25s ease, transform .15s; }
  .fugitivo.solto { position: fixed; }

  .resposta {
    margin-top: 18px; padding: 14px 16px; border-radius: 20px;
    background: linear-gradient(135deg, #fff0f6, #ffe1ec);
    border: 2px dashed #ff9fc0;
    font-size: 21px; font-weight: 700; color: var(--rosa-esc);
    animation: pop .4s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .proxima { margin-top: 16px; width: 100%; animation: pop .4s .15s both cubic-bezier(.2,1.6,.4,1); }

  /* caixa misteriosa */
  .caixa { font-size: 120px; cursor: pointer; display: inline-block; animation: tremer 1.2s infinite; user-select: none; }
  @keyframes tremer {
    0%, 60%, 100% { transform: rotate(0); }
    65% { transform: rotate(-10deg) scale(1.05); } 70% { transform: rotate(10deg) scale(1.05); }
    75% { transform: rotate(-8deg); } 80% { transform: rotate(8deg); } 85% { transform: rotate(0); }
  }
  .dica { font-size: 16px; opacity: .7; }

  /* fotos */
  .foto-moldura {
    position: relative; display: inline-block; padding: 8px 8px 34px; background: #fff;
    border-radius: 10px; box-shadow: 0 10px 30px -8px #9b1d4a77; transform: rotate(-2deg);
    animation: revelar .6s cubic-bezier(.2,1.4,.4,1); cursor: zoom-in;
  }
  .foto-moldura img { display: block; width: 230px; max-width: 62vw; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; }
  .foto-moldura .legenda { position: absolute; bottom: 6px; left: 0; right: 0; font-size: 17px; font-weight: 700; color: var(--rosa-esc); }
  .foto-moldura .cora { position: absolute; font-size: 30px; animation: batida 1s infinite; }
  @keyframes revelar { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
  @keyframes batida { 50% { transform: scale(1.25); } }

  /* balões */
  .ceu { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; }
  .slot { position: relative; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; }
  .balao {
    position: relative; width: 82%; aspect-ratio: 4/5; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    cursor: pointer; animation: boiar 2.6s ease-in-out infinite; user-select: none;
    box-shadow: inset -10px -14px 0 #00000018, inset 10px 10px 0 #ffffff40;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  .balao::after {
    content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    border: 8px solid transparent; border-bottom: 0; border-top-color: inherit;
  }
  .balao .fio { position: absolute; top: 100%; left: 50%; width: 2px; height: 34px; background: #b06; opacity: .4; margin-top: 8px; }
  @keyframes boiar { 50% { transform: translateY(-10px) rotate(2deg); } }
  .balao.estourou { animation: estourar .25s forwards; }
  @keyframes estourar { to { transform: scale(1.5); opacity: 0; } }
  .slot .mini { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 8px 20px -6px #9b1d4a77; animation: revelar .5s cubic-bezier(.2,1.4,.4,1); cursor: zoom-in; }
  .slot .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .mini span { position: absolute; top: 4px; right: 6px; font-size: 22px; animation: batida 1s infinite; }

  /* slider */
  .nota { font-size: 64px; font-weight: 800; color: var(--rosa); line-height: 1; }
  input[type=range] { width: 100%; accent-color: var(--rosa); height: 34px; margin: 10px 0 4px; }

  /* lightbox */
  #lightbox { position: fixed; inset: 0; background: #2a0612dd; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  #lightbox.aberto { display: flex; }
  #lightbox img { max-width: 100%; max-height: 88dvh; border-radius: 16px; border: 5px solid #fff; animation: revelar .4s; }

  /* explosão de corações */
  .burst { position: fixed; pointer-events: none; z-index: 60; font-size: 26px; animation: voar .9s ease-out forwards; }
  @keyframes voar { to { transform: translate(var(--dx), var(--dy)) scale(.4) rotate(var(--rot)); opacity: 0; } }

  .colagem { display: flex; justify-content: center; margin: 8px 0 4px; height: 190px; position: relative; }
  .colagem img { position: absolute; width: 120px; height: 160px; object-fit: cover; border: 5px solid #fff; border-radius: 8px; box-shadow: 0 8px 18px -6px #9b1d4a88; animation: revelar .6s both; }
</style>
</head>

</main>

const sorteia = (arr) => arr[Math.floor(Math.random() * arr.length)];

function coracoesFundo() {
  const bg = document.getElementById('bg');
  const icons = ['💗', '💕', '💖', '❤️', '💘', '🌸'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = sorteia(icons);
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 14 + Math.random() * 22 + 'px';
    h.style.animationDuration = 7 + Math.random() * 6 + 's';
    bg.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }, 650);
}
function explosao(x, y, qtd = 14, icons = ['💖', '💕', '❤️', '✨', '💘']) {
  for (let i = 0; i < qtd; i++) {
    const s = document.createElement('div');
    s.className = 'burst';
    s.textContent = sorteia(icons);
    s.style.left = x - 13 + 'px';
    s.style.top = y - 13 + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 110;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
    s.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}
function chuva(qtd = 60) {
  for (let i = 0; i < qtd; i++) {
    setTimeout(() => explosao(Math.random() * innerWidth, Math.random() * innerHeight * .7, 6, ['💖', '🎉', '💘', '🌹', '✨', '🥰']), i * 40);
  }
}
let audio;
function somPop() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(600, audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, audio.currentTime + .15);
    g.gain.setValueAtTime(.35, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .18);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + .2);
  } catch (e) {}
}
function centroDe(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

function datasAleatorias() {
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const set = new Set();
  while (set.size < (CONFIG.aniversarioReal ? 3 : 4)) set.add(`${1 + Math.floor(Math.random() * 28)} de ${sorteia(meses)}`);
  const lista = [...set];
  if (CONFIG.aniversarioReal) lista.push(CONFIG.aniversarioReal);
  return embaralha(lista);
}

function botaoProxima(card, texto = 'Próxima ➜') {

function telaEscolha(q) {
  const card = cardBase(q.emoji, q.pergunta);
  const box = $(`<div class="opcoes${q.lado ? ' lado' : ''}"></div>`);
  const opcoes = typeof q.opcoes === 'function' ? q.opcoes() : q.opcoes;
  let escalaSim = 1, escalaNao = 1;
  const botoes = opcoes.map(o => {
    const b = $(`<button class="btn ${o.classe || ''}"></button>`);
    b.textContent = o.txt;
    b.onclick = (e) => {
      botoes.forEach(x => x.classList.remove('escolhido'));
      if (!o.classe) b.classList.add('escolhido');
      explosao(e.clientX || centroDe(b)[0], e.clientY || centroDe(b)[1], o.encolhe ? 6 : 14, o.encolhe ? ['😱', '😭', '💔'] : undefined);
      mostraResposta(card, o.resp);
      if (o.encolhe) {
        escalaNao = Math.max(.45, escalaNao - .18); escalaSim += .25;
        b.style.transform = `scale(${escalaNao})`;
        const sim = botoes[opcoes.findIndex(x => x.cresce)];
        if (sim) sim.style.transform = `scale(${escalaSim})`;
        return; // só libera a próxima quando ela clicar no sim kkk
      }
      if (o.cresce) chuva(20);
      botaoProxima(card);
    };
    box.appendChild(b);
    return b;
  });
  card.appendChild(box);
  palco.appendChild(card);
}

  const area = $(`<div><div class="caixa">🎁</div><div class="dica">toca na caixa 👆</div></div>`);
  card.appendChild(area);
  const legendas = ['Olha essa perfeição 😍', 'Linda demais, pqp 🥵', 'Achei o tesouro 💎', 'Minha favorita 💘'];
  let ordem = embaralha([0, 1, 2, 3]), idx = 0;
  area.querySelector('.caixa').onclick = (e) => {
    somPop();
    explosao(e.clientX, e.clientY, 22);
    mostraFoto();
  };
  function mostraFoto() {
    const i = ordem[idx % 4];
    area.innerHTML = '';
    const m = $(`<div class="foto-moldura">
      <span class="cora" style="top:-14px;left:-12px">💖</span>
      <span class="cora" style="top:-14px;right:-12px;animation-delay:.3s">💕</span>
      <img src="${FOTOS[i]}" alt="">
      <div class="legenda">${legendas[idx % 4]}</div>
    </div>`);
    m.onclick = () => abrirFoto(FOTOS[i]);
    area.appendChild(m);
    const outra = $(`<div style="margin-top:14px"><button class="btn">Abrir outra 🎁</button></div>`);
    outra.querySelector('button').onclick = (e) => { idx++; somPop(); explosao(e.clientX, e.clientY); mostraFoto(); };
    area.appendChild(outra);
    mostraResposta(card, 'Era você esse tempo todo 🥹💖');
    botaoProxima(card);
  }
  palco.appendChild(card);
}

function telaBaloes() {
  const card = cardBase('🎈', 'Estoura os balões!');
  card.querySelector('h2').insertAdjacentHTML('afterend', '<p class="sub" style="margin-top:-10px">Cada um tem uma surpresa dentro 👀</p>');
  const ceu = $(`<div class="ceu"></div>`);
  const cores = ['#ff4f8b', '#ff8a3d', '#a259ff', '#ff6fb1'];
  const frases = ['❤️', '😍', '🔥', '💘'];
  let estourados = 0;
  FOTOS.forEach((src, i) => {
    const slot = $(`<div class="slot"></div>`);
    const b = $(`<div class="balao" style="background:${cores[i]};border-color:${cores[i]};animation-delay:${i * .3}s"><div class="fio"></div></div>`);
    b.onclick = (e) => {
      somPop();
      explosao(e.clientX, e.clientY, 18);
      b.classList.add('estourou');
      setTimeout(() => {
        b.remove();
        const mini = $(`<div class="mini"><img src="${src}" alt=""><span>${frases[i]}</span></div>`);
        mini.onclick = () => abrirFoto(src);
        slot.appendChild(mini);
      }, 220);
      estourados++;
      if (estourados === FOTOS.length) {
        setTimeout(() => {
          chuva(30);
          mostraResposta(card, 'Pronto, agora meu celular só tem foto sua 😍📸');
          botaoProxima(card);
        }, 400);
      }
    };
    slot.appendChild(b);
    ceu.appendChild(slot);
  });
  card.appendChild(ceu);
  palco.appendChild(card);
}

function telaNota() {
  const card = cardBase('💯', 'De 0 a 10, quanto você gosta de mim?');
  const area = $(`<div>
    <div class="nota">5</div>
    <input type="range" min="0" max="10" step="1" value="5">
    <div class="dica">arrasta e solta 👆</div>
  </div>`);
  const nota = area.querySelector('.nota'), range = area.querySelector('input');
  range.oninput = () => { nota.textContent = range.value; };
  range.onchange = () => {
    const v = +range.value;
    if (v < 10) {
      let n = v;
      const t = setInterval(() => {
        n++; range.value = n; nota.textContent = n;
        if (n >= 10) {
          clearInterval(t);
          nota.textContent = '10 🔥';
          mostraResposta(card, `${v}?? Acho que seu dedo escorregou... corrigi pra você 😌 10/10`);
          botaoProxima(card);
        }
      }, 120);
    } else {
      nota.textContent = '10 🔥';
      explosao(...centroDe(nota), 20);
      mostraResposta(card, 'Eu sabia 😏💘');
      botaoProxima(card);
    }
  };
  card.appendChild(area);
  palco.appendChild(card);
}

function telaFinal() {
  const card = cardBase('🌹', CONFIG.perguntaFinal);
  const box = $(`<div class="opcoes lado" style="min-height:70px"></div>`);
  const sim = $(`<button class="btn sim">Sim 😍</button>`);
  const nao = $(`<button class="btn fugitivo">Não</button>`);
  const falas = ['Não', 'Tem certeza?', 'Pensa bem 🥺', 'Erro 404', 'Desiste kkkk', 'Clica no sim 😤', 'Nem tenta'];
  let fugas = 0, escala = 1;
  function foge(e) {
    if (e) e.preventDefault();
    fugas++;
    nao.textContent = falas[Math.min(fugas, falas.length - 1)];
    const r = nao.getBoundingClientRect();
    nao.classList.add('solto');
    const maxX = innerWidth - r.width - 16, maxY = innerHeight - r.height - 16;
    nao.style.left = Math.max(16, Math.random() * maxX) + 'px';
    nao.style.top = Math.max(16, Math.random() * maxY) + 'px';
    escala = Math.min(1.9, escala + .12);
    sim.style.transform = `scale(${escala})`;
  }
  nao.addEventListener('pointerenter', foge);
  nao.addEventListener('pointerdown', foge);
  nao.addEventListener('click', foge);
  sim.onclick = () => { chuva(70); telaVitoria(); };
  box.append(sim, nao);
  card.appendChild(box);
  palco.appendChild(card);
}

function telaVitoria() {
  document.querySelectorAll('.fugitivo').forEach(b => b.remove());
  palco.innerHTML = '';
  document.getElementById('topo').hidden = true;
  const card = $(`<div class="card">
    <div class="emoji-grande">🥰</div>
    <h1>EU SABIAAA!!</h1>
    <div class="colagem">
      <img src="${FOTOS[0]}" style="transform:translateX(-80px) rotate(-12deg);animation-delay:.1s">

      <img src="${FOTOS[1]}" style="transform:rotate(-2deg);z-index:2;animation-delay:.5s">
    </div>
    <p class="sub" style="margin-top:14px">Você passou no quiz com nota 1000 💯<br>Agora tira um print e me manda 📸💘</p>
    <button class="btn">Jogar de novo 🔁</button>
  </div>`);
  card.querySelectorAll('.colagem img').forEach((img, i) => img.onclick = () => abrirFoto([FOTOS[0], FOTOS[3], FOTOS[1]][i]));
  card.querySelector('button').onclick = () => { atual = -1; render(); };
  palco.appendChild(card);
  setInterval(() => explosao(Math.random() * innerWidth, Math.random() * innerHeight * .6, 5), 1400);
}
